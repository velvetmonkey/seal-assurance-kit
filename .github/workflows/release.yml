# SPDX-License-Identifier: Apache-2.0
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require the tag to identify this exact commit
        run: test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
      - name: Run the release gate
        run: |
          node --check bin/seal
          npm test
          test -z "$(git status --porcelain)"
          node scripts/claims-drift.mjs
      - name: Build the reproducible source archive and evidence
        run: scripts/build-release.sh seal-assurance-kit "$GITHUB_REF_NAME" "$RUNNER_TEMP/release"
      - name: Publish the immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' \
            'This release provides a reproducible source archive of the seal-assurance-kit Node.js CLI and its pinned runtime files.' \
            '' \
            'It is source, not a compiled binary or an npm-registry publication. It does not claim that the CLI, its dependencies, GitHub Actions, or the source repository is uncompromised. See `SHA256SUMS` for the archive digest and `SEAL-RELEASE-PROVENANCE.json` for the workflow run, commit, and builder record.' > "$notes"
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/release/seal-assurance-kit-$GITHUB_REF_NAME.tar.gz" \
            "$RUNNER_TEMP/release/SHA256SUMS" \
            "$RUNNER_TEMP/release/SEAL-RELEASE-PROVENANCE.json" \
            --verify-tag --title "seal-assurance-kit $GITHUB_REF_NAME" --notes-file "$notes"
