# SPDX-License-Identifier: Apache-2.0
name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check bin/seal
      - run: npm test
      - name: npm test must not mutate tracked files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "npm test mutated tracked files:"; git status --porcelain; exit 1
          fi
      - run: node scripts/claims-drift.mjs
      - run: node --test test/claims-drift.test.mjs
